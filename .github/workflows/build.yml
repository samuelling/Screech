name: Build

# 1. The modem core's tests (including web-compatibility fixtures) on macOS, where CryptoKit/CommonCrypto are used.
# 2. Compile-check the iPhone app for a generic device, unsigned.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tail -40
      - name: Swift → web compatibility
        run: |
          set -e
          swift build -c release --product screech-cli
          node tools/web-decode.mjs --self-test
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Screech
        run: |
          set -o pipefail
          xcodebuild -project Screech.xcodeproj -target Screech -sdk iphoneos \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Surface warnings and errors as annotations
        if: always()
        run: |
          grep -E "^/.*\.swift:[0-9]+:[0-9]+: (warning|error):" build.log | sort -u | head -40 | \
            sed -E 's#^.*/(Screech/[^:]+):([0-9]+):[0-9]+: (warning|error): (.*)$#::\3 file=\1,line=\2::\4#' || true
